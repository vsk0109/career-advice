name: Keep Render services awake

# Render's free tier sleeps a service after 15 minutes of no traffic, causing
# a slow (or briefly failing, via a 502) first request afterward. Pinging
# both services on a schedule keeps them warm during active hours instead.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf --max-time 30 https://career-advice.onrender.com/health
        continue-on-error: true

      - name: Ping frontend
        run: curl -sf --max-time 30 https://career-mentor-3sce.onrender.com
        continue-on-error: true
